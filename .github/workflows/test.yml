name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19", "24"]
        openspec: [lowest, latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Resolve the OpenSpec version
        id: openspec
        run: |
          if [ "${{ matrix.openspec }}" = "lowest" ]; then
            v=$(tr -d '\r' < package/skills/openspec-lite-schema/assets/plan-lite/schema.yaml | sed -n 's/^openspec-version: *">=\([0-9.]*\).*/\1/p')
            test -n "$v" || { echo "cannot read the lower bound of openspec-version"; exit 1; }
          else
            v=latest
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: npm install -g "@fission-ai/openspec@$OPENSPEC_VERSION"
        env:
          OPENSPEC_VERSION: ${{ steps.openspec.outputs.version }}
      - run: openspec --version
      - run: node scripts/check-version.mjs
      - run: node --test

  tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag matches package/apm.yml
        run: |
          v=$(tr -d '\r' < package/apm.yml | sed -n 's/^version: *\([^ ]*\) *$/\1/p')
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match version $v in package/apm.yml"; exit 1; }

  schema-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check that a schema asset change bumps the schema version
        run: |
          # On a tag push, compare with the tag before this one. Otherwise, compare with the latest tag.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then ref=HEAD^; else ref=HEAD; fi
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$ref" 2>/dev/null) || { echo "no previous tag"; exit 0; }
          assets=package/skills/openspec-lite-schema/assets/plan-lite
          if git diff --quiet "$prev" HEAD -- "$assets"; then echo "no asset change since $prev"; exit 0; fi
          # The same version rule as install.mjs: optional quotes and an optional trailing comment.
          ver() { node -e 'const m = require("fs").readFileSync(0, "utf8").match(/^version:\s*["\x27]?(\d+)["\x27]?\s*(?:#.*)?$/m); console.log(m ? m[1] : "")'; }
          old=$(git show "$prev:$assets/schema.yaml" | ver)
          new=$(ver < "$assets/schema.yaml")
          if [ -z "$old" ] || [ -z "$new" ]; then echo "cannot read the schema version (old=$old, new=$new)"; exit 1; fi
          if [ "$new" -le "$old" ]; then echo "files under $assets changed since $prev, but version stayed $old"; exit 1; fi
          echo "schema version $old -> $new"
