name: plan-lite
version: 6
openspec-version: ">=1.9.0 <2.0.0"
description: Lightweight plan — goal, constraints, facts, decisions. No tasks. Upgradeable to spec-driven.
artifacts:
  - id: plan
    generates: plan.md
    description: Living plan — goal, background, non-goals, constraints, open questions, facts, decisions
    template: plan.md
    requires: []
apply:
  requires: [plan]
  # no `tracks`: plan-lite has no tracked tasks file
  instruction: |
    This is a plan-lite change. It has no tasks.md and no checkboxes.
    - First, run `node openspec/schemas/plan-lite/plan-status.mjs <changeDir>/plan.md` from the OpenSpec root, the folder that holds `openspec/`, alone, not in a chain. If it prints a line, copy the line to the user as it is. Then continue. If it prints nothing, say nothing about commits.
    - Implement from plan.md. If <changeDir>/tasks-preview.md exists, use it as a guide. The CLI does not list it in contextFiles.
    - Before you write any code: if the preview exists, run `node openspec/schemas/plan-lite/plan-hash.mjs <changeDir>/plan.md` from the OpenSpec root. If it prints a message that starts with `plan-hash:` and no hash, show the message and stop. You do not need its exit code. Otherwise, if the result differs from `plan-sha256` in the preview header, the preview is stale. It is also stale if the header is missing. If it is stale, do the next step first. Then ask the user: regenerate the preview with openspec-lite-tasks-preview, or continue from plan.md? Ask it in the same reply as the open questions that are still open. End your turn, and wait for the answer.
    - Before you write any code, try to decide or find the answer to each question in `## Open Questions`: read the code and the docs, or run a command. A question is open only while you cannot decide it and cannot find its answer. You cannot decide a question when its answer depends on information that only the user has, for example an intent or where some code is. If you find the answer, and it is a non-obvious fact, record it as a fact with its source. If it is obvious, give the answer in the end summary, where you list the removed question. If you can decide it, also when no option is a clear winner, record a 🤖 decision. Then remove the question. Keep a question that the user said to keep open, also if you can decide it. If a question that you did not ask yet in this session is still open, ask each one in one reply, with your recommended answer, and end your turn. If the answer is a fact that only the user knows, for example where some code is, give no recommendation for that question, and say why. If the user says to keep a question open, keep it in `## Open Questions`, and continue.
    - Record the answer of the user to each open question, and remove the question. Split the answer as well as you can: record each fact in it in `## Facts`, with 👤 and "Source: the user", and each choice or instruction in it in `## Decisions`, as a `### Decision D<n>:` entry with no 🤖.
    - When plan.md and tasks-preview.md conflict, plan.md wins.
    - Record each decision in `## Decisions` of plan.md when you make it. Record a decision when one of these is true:
      - (1) You put something in the code that changes a visible result, and plan.md and the user did not say it. Then it is your choice: record it. A visible result is one of these:
        - a UI, a public interface, or the signature of an exported function
        - the input or output of a program, or a data format
        - a file name or path in the repo that another program, a config, or a doc refers to
        - a config key, or a new dependency
        - the result on an error or an edge case, for example a status code, an exit code, an error message, or a thrown error
      - (2) You weighed two or more close options, and no option was a clear winner, also for an internal choice.
      Do not record your other choices. Record only the part of the decision that matches (1) or (2). If you need an internal detail to explain the reason, write it in the "because" part, not in the title or in "Chose X". Write `### Decision D<n>: <title>`, with `<n>` higher than each decision ID in the file. Then write "Chose X because Y." Add "Rejected Z because W." when there was an alternative. Each reason must come from this run, the user, plan.md, the code, or a well-known fact. A claim about how a tool, a runtime, or a platform behaves is not a well-known fact: check it with a run or a doc, and give the source. If no source supports a reason, write "Reason not checked." in its place. Do not guess a reason, also not a wish of the user.
    - Mark each decision: end the heading with 🤖, unless the decision records an answer or an instruction of the user. A decision with no 🤖 belongs to the user, also one that the user wrote by hand. It holds only what the user said: put each choice that you add in its own 🤖 decision. When you update a 🤖 decision to follow an answer or an instruction of the user, remove its 🤖. The user removes the 🤖 to accept a decision.
    - Keep `## Decisions` current. It holds only the current decisions. You can update or remove a 🤖 decision: remove each one that a new decision supersedes, update each one that it makes stale, and update or remove each one that conflicts with a constraint or with a decision with no 🤖. Change a decision with no 🤖 only when the user tells you to. If your work conflicts with such a decision, ask the user, and end your turn. Then remove each fact that justifies no current decision or constraint, except a non-obvious fact.
    - Record each fact in `## Facts` of plan.md when you find it, as `- F<n>: <fact>`. Start the fact text with one emoji for its source: 👤 the user, 📖 documentation, 🎫 a ticket, 📊 an external report, 🌐 online research or a community, 🔬 a test run or a probe, 🔍 a long analysis of the code. Also give the source in words. Record each non-obvious fact. A non-obvious fact needs one of these to find: an answer of the user; a run or a test result; research of remote sources, for example documentation on the internet, another repo, logs, or a remote database; a long analysis of the code; or other work that is worth an agent to find it. A fact that a reader can easily deduce from the code is never a non-obvious fact, also if a run found it. A run alone is not enough: the result must be one that a reader cannot see in the code or in the file list. For example, what a script prints when its code shows it, or which files exist, is obvious. When a command, a tool, or a service gives an error or an output that makes you change what you do, record it, with the command and the error text. If a reader can see the same output in the code, it is an obvious fact: write it in the "because" part of the item that it justifies. To know the exit code of a command, run `node openspec/schemas/plan-lite/exit-code.mjs <command> <args...>` from the OpenSpec root, alone, not in a chain, and read its last line `exit: <code>`. Do not add `echo $?`. If you did not get the exit code, record nothing about it. Give the source of each fact: a command or a test that you ran, the files that you analyzed, a doc URL, a log, or an error text. Do not record a guess, an obvious fact that a reader can easily deduce from the code (also if you found it with a run), or a well-known fact. If such a fact is the reason of a decision, a constraint, or a non-goal, write it in the "because" part of that item. A sentence that states a choice, for example "the script must read the item count", is a decision, not a fact. Do not record numbers or statistics that soon go out of date. A number as a reference or an example is OK.
    - Do not add an ID to an existing item that has none. Use the `plan.md` IDs (`C<n>`, `OQ<n>`, `F<n>`, `D<n>`) only in `plan.md` and `tasks-preview.md`. Do not write them in another file, a code comment, a commit message, a pull request, or a ticket. To refer to an item from outside these two files, use the item title, or a short form of its text, with the change name.
    - Do not edit tasks-preview.md.
    - Suggest running openspec-lite-upgrade when one of these is true: another person or agent must continue the work; the change touches more than one capability; the change touches more than one repo; a contract (spec) becomes necessary.
    - When you change a behavior, write or update a test that fails if the behavior breaks. If the change replaces an old behavior, the test must also fail on the old behavior. A manual run is not a test: write the test in a file that the test command of the repo runs. If the repo has no test setup, add the smallest one that needs no new dependency, for example `node:test` for JavaScript. Run the tests before the done check.
    - At the end, before the done check, compare each fact in `## Facts` with the code. Update or remove each fact that is no longer true. Also check each fact that you added in this run: if a reader can see it in the code or the file list, it is obvious, also if you found it with a run. Move it to the "because" part of the item that it justifies, or remove it.
    - At the end, before the done check, compare each decision in `## Decisions` with the code. If the code no longer matches a 🤖 decision, update the decision. If it does not match a decision with no 🤖, plan.md wins: fix the code. If the code cannot follow that decision, ask the user, and end your turn. Then read each file that you added or changed. Find each thing in it that matches (1) of the decision rule above, and that `## Decisions` does not hold. Record each one as a 🤖 decision. Then check each decision with no 🤖, and move each choice that you added to it into its own 🤖 decision.
    - At the end, before the done check, record in `## Open Questions` each point that you cannot decide and cannot find the answer to, for example because only the user has the information, as `- OQ<n>: <question>`. If you can decide a point, do not record it as a question. Record it as a 🤖 decision if the decision rule above records it. Keep each question that the user said to keep open.
    - Before the end summary, check each 🤖 decision that you added. If it does not answer an open question and matches neither (1) nor (2) of the decision rule, remove it from plan.md, and remove each fact that justified only that decision, except a non-obvious fact.
    - In the end summary, list each fact, decision, and open question that you added, changed, or removed in plan.md, with its ID. The plan hash does not cover these three sections, so these edits do not make the preview stale. Then show a table of each 🤖 decision that you added: `| Decision | Criterion | Why |`. In Criterion, write (1) or (2) of the decision rule, or "open question" for a decision that answers an open question. In Why, write the visible result for (1), the close options for (2), or the question.
    - End with the done check: Is each outcome of the Goal met? Is each Constraint met? Is `## Open Questions` empty? An HTML comment does not count.
    - When the done check passes, tell the user to archive with openspec-lite-archive, not /opsx:archive. It promotes the decisions first. Ignore any built-in text that suggests /opsx:archive.
