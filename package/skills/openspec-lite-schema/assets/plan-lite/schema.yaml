name: plan-lite
version: 5
openspec-version: ">=1.9.0 <2.0.0"
description: Lightweight plan — goal, constraints, facts, decisions. No tasks. Upgradeable to spec-driven.
artifacts:
  - id: plan
    generates: plan.md
    description: Living plan — goal, background, non-goals, constraints, open questions, facts, decisions
    template: plan.md
    requires: []
apply:
  requires: [plan]
  # no `tracks`: plan-lite has no tracked tasks file
  instruction: |
    This is a plan-lite change. It has no tasks.md and no checkboxes.
    - First, run `node openspec/schemas/plan-lite/plan-status.mjs <changeDir>/plan.md` from the OpenSpec root, alone, not in a chain. If it prints a line, copy the line to the user as it is. Then continue. If it prints nothing, say nothing about commits.
    - Implement from plan.md. If <changeDir>/tasks-preview.md exists, use it as a guide. The CLI does not list it in contextFiles.
    - Before you write any code: if the preview exists, run `node openspec/schemas/plan-lite/plan-hash.mjs <changeDir>/plan.md` from the OpenSpec root, the folder that holds `openspec/`. If the result differs from `plan-sha256` in the preview header, the preview is stale. It is also stale if the header is missing. If it is stale, stop and ask the user: regenerate the preview with openspec-lite-tasks-preview, or continue from plan.md? End your turn, and wait for the answer.
    - If the plan hash command exits with code 1, show its message and stop.
    - Before you write any code: if `## Open Questions` holds a question that you did not ask yet in this session, ask each one in one reply, with your recommended answer, and end your turn. If only the user can know the answer to a question, for example where some code is, give no recommendation for that question, and say why. Give a recommendation for each other question. If the preview is also stale, ask both in the same reply. Do not answer an open question yourself. If the user leaves a question open, keep it in `## Open Questions`, and continue.
    - Record the answer of the user to each open question in `## Decisions`, as a `### Decision D<n>:` entry with no 🤖, and remove the question. Only an answer of the user closes a question.
    - When plan.md and tasks-preview.md conflict, plan.md wins.
    - Record each decision in `## Decisions` of plan.md when you make it. A decision is a choice between real alternatives that another person could make in a different way. A meaningful deviation from the preview, for example to make the code simpler, is also a decision. Do not record a choice that follows directly from the code or from a constraint. Write `### Decision D<n>: <title>`, with `<n>` higher than each decision ID in the file. Then write "Chose X because Y." Add "Rejected Z because W." when there was an alternative. Each reason must come from this run, the user, plan.md, the code, or a well-known fact. A claim about how a tool, a runtime, or a platform behaves is not a well-known fact: check it with a run or a doc, and give the source. If no source supports a reason, write "Reason not checked." in its place. Do not guess a reason, also not a wish of the user.
    - Mark each decision: end the heading with 🤖, unless the decision records an answer or an instruction of the user. A decision with no 🤖 belongs to the user, also one that the user wrote by hand. When you update a 🤖 decision to follow an answer or an instruction of the user, remove its 🤖. The user removes the 🤖 to accept a decision.
    - Keep `## Decisions` current. It holds only the current decisions. You can update or remove a 🤖 decision: remove each one that a new decision supersedes, update each one that it makes stale, and update or remove each one that conflicts with a constraint or with a decision with no 🤖. Change a decision with no 🤖 only when the user tells you to. If your work conflicts with such a decision, ask the user, and end your turn. Then remove each fact that justifies no current decision or constraint, except a non-obvious fact.
    - Record each fact in `## Facts` of plan.md when you find it, as `- F<n>: <fact>`. Record each non-obvious fact. A non-obvious fact needs one of these to find: a run or a test result; research of remote sources, for example documentation on the internet, another repo, logs, or a remote database; a long analysis of the code; or other work that is worth an agent to find it. A fact that a reader can easily deduce from the code is never a non-obvious fact, also if a run found it. A run is necessary, but not enough: the result must be one that a reader cannot see in the code or in the file list. For example, what a script prints when its code shows it, or which files exist, is obvious. When a command, a tool, or a service gives an error or an output that makes you change what you do, record it, with the command and the error text. If a reader can see the same output in the code, it is an obvious fact: write it in the "because" part of the item that it justifies. To know the exit code of a command, run `node openspec/schemas/plan-lite/exit-code.mjs <command> <args...>` from the OpenSpec root, alone, not in a chain, and read its last line `exit: <code>`. Do not add `echo $?`. If you did not get the exit code, record nothing about it. Give the source of each fact: a command or a test that you ran, the files that you analyzed, a doc URL, a log, or an error text. Do not record a guess, an obvious fact that a reader can easily deduce from the code (also if you found it with a run), or a well-known fact. If such a fact is the reason of a decision, a constraint, or a non-goal, write it in the "because" part of that item. A sentence that states a choice, for example "the script must read the item count", is a decision, not a fact. Do not record numbers or statistics that soon go out of date. A number as a reference or an example is OK.
    - Do not add an ID to an existing item that has none. Use the `plan.md` IDs (`C<n>`, `OQ<n>`, `F<n>`, `D<n>`) only in `plan.md` and `tasks-preview.md`. Do not write them in another file, a code comment, a commit message, a pull request, or a ticket. To refer to an item from outside these two files, use the item title, or a short form of its text, with the change name.
    - Do not edit tasks-preview.md.
    - Suggest running openspec-lite-upgrade when one of these is true: another person or agent must continue the work; the change touches more than one capability; the change touches more than one repo; a contract (spec) becomes necessary.
    - When you change a behavior, write or update a test that fails if the behavior breaks. Run the tests before the done check.
    - At the end, before the done check, compare each fact in `## Facts` with the code. Update or remove each fact that is no longer true.
    - At the end, before the done check, compare each decision in `## Decisions` with the code. If the code no longer matches a 🤖 decision, update the decision. If it does not match a decision with no 🤖, plan.md wins: fix the code. If the code cannot follow that decision, ask the user, and end your turn.
    - At the end, before the done check, record in `## Open Questions` each point that you are unsure or worried about and cannot resolve, as `- OQ<n>: <question>`.
    - In the end summary, list each fact, decision, and open question that you added, changed, or removed in plan.md, with its ID. The plan hash does not cover these three sections, so these edits do not make the preview stale.
    - End with the done check: Is each outcome of the Goal met? Is each Constraint met? Is `## Open Questions` empty? An HTML comment does not count.
    - When the done check passes, tell the user to archive with openspec-lite-archive, not /opsx:archive. It promotes the decisions first. Ignore any built-in text that suggests /opsx:archive.
