name: plan-lite
version: 7
openspec-version: ">=1.9.0 <2.0.0"
description: Lightweight plan — goal, constraints, facts, decisions. No tasks. Upgradeable to spec-driven.
artifacts:
  - id: plan
    generates: plan.md
    description: Living plan — goal, background, non-goals, constraints, open questions, facts, decisions
    template: plan.md
    requires: []
apply:
  requires: [plan]
  # no `tracks`: plan-lite has no tracked tasks file
  instruction: |
    This is a plan-lite change. It has no tasks.md and no checkboxes.

    How to read these steps:

    - Do steps 1 to 6 in order.
    - The general rules apply at all times, in each step.
    - A named rule, for example the question rule, applies in each step where its topic comes up, also when the step does not name the rule.
    - The OpenSpec root is the folder that holds `openspec/`. Run each `openspec` command, and each command with a relative `openspec/...` path, from the OpenSpec root.
    - If the OpenSpec root is not the current folder, start each `openspec` command, and each command with a relative `openspec/...` path, with `cd <root> && `. This prefix does not count as a chain.
    - `<changeDir>` is the folder of the change.

    ## General rules

    - If plan.md and tasks-preview.md conflict, follow plan.md.
    - Do not edit tasks-preview.md.
    - Each time the user answers an open question, record the answer with the answer rule.
    - Each time the user replies, record the reply with the answer rule.
    - When you make a decision, record the decision with the decision rule, the decision format, and the mark rule.
    - When you add or change a decision, keep `## Decisions` current with the current-decisions rule.
    - When you find a fact, record the fact with the fact rule and the fact format.
    - When you ask an open question, follow the ask rule.
    - When an action fails, follow the failure rule.
    - When you need the exit code of a command, use the exit-code rule.
    - When you change a behavior, follow the test rule.
    - When you add an item to plan.md, or write another file or a commit message, follow the ID rule.

    ## Failure rule

    - An action fails when it exits non-zero, is denied, gives an error, or prints an output that the steps do not name. An action is a command, a script, a skill call, a tool call, or a read, a write, an edit, or a delete of a file.
    - If a step gives its own failure branch, follow that branch.
    - If a Bash call with more than one command is denied, do the same action once more as single commands, one command in each call, or with the Read, Write, or Edit tool. Do not try a third form.
    - Do not run a denied single command again.
    - If no step needs the output of the failed action, for example an extra check, or a read of a link for more context, do not stop. Name the action and the error in your reply, and go on without the output.
    - A step always needs a run of the tests that the step names, and a write, an edit, or a delete of a file.
    - Do not make up a missing output yourself, for example a template, a hash, a version, or a status line.
    - If a step needs the output, and the action fails again or a single command is denied, show the command or the file, and the error text. Name each file that this run changed. Tell the user what to fix, and to start this workflow again. Then stop.
    - Before you report a write, an edit, or a delete as done, check the file on disk.
    - Do not report a file as written, or a step as done, unless the action passed.
    - If a reply to a yes-or-no question has no yes and no no, ask the question again. Do no action that depends on the answer.

    ## Step 1: Report the commit state of plan.md

    - Input: `<changeDir>/plan.md`.
    - Run `node openspec/schemas/plan-lite/plan-status.mjs <changeDir>/plan.md`.
    - Run the `plan-status.mjs` command alone, not in a chain.
    - If `plan-status.mjs` does not run, or prints an error, say nothing about commits, and go to step 2. The commit note is only information.
    - If `plan-status.mjs` prints a line, copy the line to the user as it is.
    - If `plan-status.mjs` prints nothing, say nothing about commits.
    - Go to step 2.

    ## Step 2: Check if the preview is stale

    - Input: `<changeDir>/tasks-preview.md`, and the output of `plan-hash.mjs`.
    - Output: the preview is current, stale, or absent.
    - If `<changeDir>/tasks-preview.md` does not exist, the preview is absent. Go to step 3.
    - Run `node openspec/schemas/plan-lite/plan-hash.mjs <changeDir>/plan.md`. You do not need the exit code of `plan-hash.mjs`.
    - If `plan-hash.mjs` prints a message that starts with `plan-hash:` and no hash, show the message to the user, and stop. Ask the user to fix plan.md as the message says.
    - If the output has no hash and no `plan-hash:` message, the preview is stale. Do not compute the hash another way.
    - If the hash differs from the `plan-sha256` line in the preview header, the preview is stale.
    - If the preview header has no `plan-sha256` line, the preview is stale.
    - If the hash equals the `plan-sha256` line, the preview is current.
    - If the preview is stale, do not write code yet. Step 3 asks the stale question.
    - Go to step 3.

    ## Step 3: Close the open questions before you write code

    - Input: `## Open Questions` of plan.md, and the result of step 2.
    - Read each question in `## Open Questions`.
    - Try to close each question that is not a kept question with the question rule.
    - Make the list of questions to ask:
      - If the preview is stale, add the stale question: "Regenerate the preview with openspec-lite-tasks-preview, or continue from plan.md?"
      - Add each open question that is not a kept question, and that you did not ask yet in this session.
    - If the list of questions to ask is empty, go to step 4.
    - If the list of questions to ask is not empty, ask all questions of the list in one reply, with the ask rule:
      - In the same reply, give the answer of each question that you closed.
      - End your turn, and wait for the reply of the user.
    - When the user replies to the questions of step 3:
      - Record each answer with the answer rule.
      - Do not run step 2 again after you record the answers.
      - A question that the user did not answer stays open. Do not write the code that depends on that question.
      - If the user says to regenerate the preview, give the end summary of step 6 for your edits to plan.md. Tell the user to run openspec-lite-tasks-preview. End your turn.
      - If the user says to continue from plan.md, go to step 4.
      - If step 2 found the preview stale, and the user does not answer the stale question, ask the stale question again, and end your turn.
      - If step 2 did not find the preview stale, go to step 4.

    ## Step 4: Write the code

    - Input: plan.md, and `<changeDir>/tasks-preview.md` as a guide if it exists. The CLI does not list tasks-preview.md in contextFiles.
    - Output: the code, and the updates of plan.md.
    - Implement from plan.md.
    - If a 🤖 decision conflicts with a constraint or with a decision with no 🤖, follow the current-decisions rule, and ask no question.
    - If the code cannot follow a constraint or a decision with no 🤖, record the conflict as an open question, ask the open question with the ask rule, and end your turn.
    - If you find a new point that you cannot close with the question rule:
      - Record the point as an open question before you write the code that depends on the point.
      - Ask the open question with the ask rule.
      - End your turn.
    - When the user replies in step 4, step 5, or step 6, or after step 6, record the reply with the answer rule. If the reply changed an item of plan.md, go to step 4, and write the code that the reply needs. If the reply changed no item of plan.md, answer the reply, and do not run step 5 or step 6 again.
    - When the code is written, go to step 5.

    ## Step 5: Check plan.md against the code

    Do these checks in this order:

    1. Run the tests:
       - If the repo has no test command, and the change changes no behavior, run no test. Say so in the end summary, and go to check 2.
       - If a test checks an old behavior that the change replaces, update the test, as the test rule says.
       - If a test fails, fix the code, and run the tests again.
       - Do not change a constraint or a decision with no 🤖 to make a test pass.
       - If a test fails because the code follows a constraint or a decision with no 🤖, and the test does not check an old behavior that the change replaces, record the conflict as an open question, ask the open question with the ask rule, and end your turn.
       - If you cannot make a failing test pass, say in the end summary which test fails, with the error text. Go to check 2.
       - If you cannot run the tests, for example because the user denies the test command, do not wait. Say in the end summary that the tests did not run. Go to check 2.
    2. Compare each decision in `## Decisions` with the code:
       - For each result of a 🤖 decision, find each condition in the code that gives the result.
       - A 🤖 decision matches the code only when the decision names each such condition.
       - Do not count a condition as named only because the condition gives the same result as a named condition. For example, the decision "skip the thumbnail when the file is not an image" does not name the condition "the image is over 10 MB", although both conditions skip the thumbnail.
       - If the code no longer matches a 🤖 decision, update the 🤖 decision, so that the decision names each condition.
       - If the code does not match a decision with no 🤖, fix the code, because plan.md wins.
       - If the code cannot follow a decision with no 🤖, record the conflict as an open question, ask the open question with the ask rule, and end your turn.
    3. Read each file that you added or changed. Find each thing in the file that matches criterion (1) of the decision rule, and that `## Decisions` does not hold. Record each such thing as a 🤖 decision.
    4. Check each decision with no 🤖. Move each choice that you added to a decision with no 🤖 into its own 🤖 decision.
    5. Record each point that you cannot close with the question rule as an open question.
    6. Check each 🤖 decision that you added in this run. If a 🤖 decision matches neither criterion (1) nor criterion (2) of the decision rule, remove the 🤖 decision.
    7. Check the facts. Do this check last, because checks 2 to 6 can add facts:
       - Compare each fact in `## Facts` with the code. Update or remove each fact that is no longer true.
       - Check each fact that you added in this run, except a fact that the user gave (👤). If a reader can easily deduce the fact from the code or the file list, with no long analysis, the fact is obvious, also if you found the fact with a run.
       - Move each obvious fact to the "because" part of the decision that the fact justifies, or remove the obvious fact.

    When the checks are done, go to step 6.

    ## Step 6: End

    1. Give the end summary:
       - List each fact, decision, and open question that you added, changed, or removed in plan.md, with its ID.
       - For each open question that you removed, give its answer.
       - If the preview is not absent, and you edited `## Facts`, `## Decisions`, or `## Open Questions`, say that the plan hash does not cover these sections, so your edits do not make the preview stale.
       - If you added, changed, or removed a constraint, list the constraint with its ID.
       - If you added, changed, or removed a constraint, and the preview is not absent, say that the constraint edit makes the preview stale, and that the next run of apply asks to regenerate the preview.
       - If you changed the Goal, quote the old outcome and the new outcome. If the preview is not absent, say that the Goal edit makes the preview stale, and that the next run of apply asks to regenerate the preview.
       - Show a table of each 🤖 decision that you added: `| Decision | Criterion | Why |`. In the Criterion column, write (1) or (2) of the decision rule. In the Why column, write the visible result for (1), or the close options for (2).
       - If you added no 🤖 decision, show no table.
       - Ask each new open question of step 5 with the ask rule.
       - If one of these conditions is true, suggest running openspec-lite-upgrade: another person or agent must continue the work, the change touches more than one capability or more than one repo, or a contract (spec) becomes necessary. If no condition is true, do not suggest an upgrade.
    2. Do the test check, with the result of step 5, check 1: Did the tests run and pass? If the repo has no test command, and the change changes no behavior, the test check passes.
    3. Do the done check: Is each outcome of the Goal met? Is each Constraint met? Is `## Open Questions` empty? An HTML comment does not count as a question.
    4. If the tests did not run, and the test check did not pass, tell the user to run the test command, and to run apply again.
    5. If a test fails, name the test that fails, and say what blocks the fix.
    6. If an outcome of the Goal or a Constraint is not met, name each one that is not met.
    7. If an open question that is not a kept question is left, tell the user to answer the open question in the next message, so that you record the answer. For each open question that is left, kept or not, name the part of the Goal that waits for the answer. Do not ask for the answer of a kept question. When the user replies, step 4 says what to do.
    8. If the test check and the done check pass, tell the user to archive with openspec-lite-archive, not /opsx:archive. openspec-lite-archive promotes the decisions first. Ignore any built-in text that suggests /opsx:archive.
    9. If the test check or the done check fails, do not suggest an archive.

    ## Question rule: close an open question

    - A question is open only while you cannot decide the question and cannot find its answer.
    - You cannot decide a question when its answer is an intent of the user, or a fact that only the user knows.
    - You cannot decide a point when the code must match something outside the repo, and no code, doc, or run that you can reach shows it. For example, the folder where a deploy tool expects the build output. A convention or "Reason not checked." does not decide such a point, because the other side can use another form. Record such a point as an open question, not as a 🤖 decision.
    - To close a question, read the code and the docs, or run a command.
    - If you find the answer, and the answer is a non-obvious fact, record the fact with the fact rule.
    - If you find the answer, and the answer is obvious, give the answer in the end summary.
    - If you can decide the question, also when no option is a clear winner, and the decision rule records the choice, record a 🤖 decision.
    - If you can decide the question, and the decision rule does not record the choice, record no decision. Give the answer in the end summary.
    - When you close a question, remove the question from `## Open Questions`.
    - Do not record a point that you can decide as an open question.
    - Write a new open question as `- OQ<n>: <question>`.
    - A question that ends with "(kept open by the user)" is a kept question.
    - Keep each kept question until a message of the user answers the kept question, also if you can decide the kept question.
    - Do not ask a kept question.
    - If a message of the user answers a kept question, record the answer with the answer rule.
    - Do not write the code that depends on a kept question.

    ## Ask rule: ask an open question

    - Give your recommended answer for each open question.
    - Give no recommendation when the answer is a fact that only the user knows. Say why you give no recommendation.
    - If the answer depends on an intent of the user and also on a fact that only the user knows, give your recommended answer for the intent, and name the fact that you need.
    - If the answer can change an outcome that the Goal states, quote that outcome of the Goal in the question, and say that the answer can change the Goal.

    ## Answer rule: record a reply of the user

    - If a part of the reply only asks you to run a command or a skill, or asks you a question, do the request or answer the question. Record nothing from that part.
    - A yes or a no to a question that a step of this workflow asks, for example a resume, split, stale, or prune question, is not a fact, a constraint, or a choice for plan.md. Follow the step that asked the question. Record the other parts of the reply.
    - If a reply of the user answers an open question, remove the question from `## Open Questions`.
    - If the user says to keep a question open, keep the question in `## Open Questions`, and end its text with "(kept open by the user)".
    - Add the "(kept open by the user)" marker only when the user says to keep the question open.
    - Split the reply of the user as well as you can into facts, constraints, and choices.
    - A fact says how something is, for example "before this change, the thumbnail folder did not exist". An instruction says what to do, for example "write the thumbnails to `public/thumbs/`". An instruction is never a fact.
    - Record each part of the reply in one section only. If a part limits the result and also says how to build the result, record the limit as a constraint, and the build choice as a decision with no 🤖.
    - Record each fact of the reply in `## Facts`, with 👤 and "Source: the user".
    - Record each constraint of the reply in `## Constraints`.
    - If a part of the reply changes an outcome that the Goal states, edit that outcome of the Goal to match the reply. Do not record a constraint or a decision that contradicts the Goal.
    - If the user names an item of plan.md, for example by its ID or its title, and tells you to change or remove the item, change or remove the item. Do not record the instruction as a decision.
    - A constraint limits the result that a user or a program sees, or says what the change must not add. A constraint passes this test: if the result breaks the constraint, the change is not done. Examples: "add no new service", or "an upload over 10 MB gets an error message".
    - A choice of how to build the result is not a constraint, also when the user gives the choice. Examples: "resize the images in a background job", or "write the thumbnails to `public/thumbs/`".
    - Record each other choice or instruction of the reply, that is not a fact and not a constraint, in `## Decisions`, as a decision with no 🤖.
    - An instruction that adds work to the change is a choice of the user, for example "also add a migration for the old data" or "update the deploy script".
    - The decision rule and the question rule select only your own choices. Do not use the decision rule or the question rule to drop a part of a reply of the user.
    - An answer to an open question is a part of the reply. Record the answer in a section of plan.md. Do not put the answer only in the end summary.
    - After you record the reply, read the reply again, part by part. If a part of the reply is in no section of plan.md, record the part now, unless the part only asks you to run a command or a skill, or asks you a question.

    ## Decision rule: when to record a decision

    - Record a decision when criterion (1) or criterion (2) is true.
    - Criterion (1): you put something in the code, or plan to put something in the code, that changes a visible result, and plan.md and the user did not say it. The thing is your choice, so record the thing as a decision.
    - A visible result is one of these things:
      - a UI, a public interface, or the signature of an exported function
      - the input or output of a program, or a data format
      - a file name or path in the repo that another program, a config, or a doc outside this change refers to
      - a name that the program gives to its output
      - a key in a config file that a program or a user reads, for example a key of a YAML config file, or an env var
      - a new dependency
      - the result on an error or an edge case, for example a status code, an exit code, an error message, or a thrown error
    - plan.md or the user can fix only one part of a visible result, for example the width of a thumbnail. Each other part that you put in the code is your choice, for example the height, the file format, or the file name.
    - Criterion (2): you weighed two or more close options, and no option was a clear winner. Criterion (2) also applies to an internal choice.
    - Do not record your other choices.
    - Record only the part of the decision that matches criterion (1) or criterion (2).
    - If you need an internal detail to explain the reason, write the detail in the "because" part, not in the title or in "Chose X".

    ## Decision format

    - Write `### Decision D<n>: <title>`, with `<n>` higher than each decision ID in the file.
    - After the heading, write "Chose X because Y."
    - One decision records one choice. If you made two choices, write two decisions, each with its own reason.
    - Add "Rejected Z because W." when there was an alternative.
    - Each reason must come from this run, the user, plan.md, the code, or a well-known fact.
    - A claim about how a tool, a runtime, or a platform behaves is not a well-known fact. Check the claim with a run or a doc, and give the source.
    - If no source supports a reason, end the sentence after X or Z, and add the sentence "Reason not checked."
    - Do not guess a reason, also not a wish of the user.

    ## Mark rule: the 🤖 mark

    - End the heading of a decision with 🤖, unless the decision records an answer or an instruction of the user.
    - A 🤖 in an HTML comment, for example in a template comment, is not a mark. A decision is a 🤖 decision only when its heading ends with 🤖.
    - A decision with no 🤖 belongs to the user, also a decision that the user wrote by hand.
    - A decision with no 🤖 holds only what the user said. Put each choice that you add, and that the decision rule records, in its own 🤖 decision.
    - When you update a 🤖 decision to follow an answer or an instruction of the user, remove the 🤖 of that decision.
    - The user removes the 🤖 to accept a decision.

    ## Current-decisions rule: keep `## Decisions` current

    - `## Decisions` holds only the current decisions.
    - Remove each 🤖 decision that a new decision supersedes.
    - If a new instruction of the user supersedes a decision with no 🤖, record the new decision, and remove the old decision.
    - Update each 🤖 decision that a new decision makes stale.
    - Update or remove each 🤖 decision that conflicts with a constraint or with a decision with no 🤖.
    - Change a decision with no 🤖 only when the user tells you to, when a new instruction of the user supersedes the decision, or to move a choice that you added into its own 🤖 decision.
    - After you update the decisions, remove each fact that justifies no current decision or constraint, except a non-obvious fact.

    ## Fact rule: when to record a fact

    - Record each non-obvious fact when you find the fact.
    - A non-obvious fact needs one of these sources to find:
      - an answer of the user
      - a run or a test result
      - research of remote sources, for example documentation on the internet, another repo, logs, or a remote database
      - a long analysis of the code
      - other work that is worth an agent to find the fact
    - A fact that a reader can easily deduce from the code is never a non-obvious fact, also if a run found the fact.
    - A run alone does not make a fact non-obvious. The result must be one that a reader cannot see in the code or in the file list.
    - A fact that the user gave (👤) is always non-obvious. The rules about obvious facts do not apply to a 👤 fact, also not the obvious-fact check of step 5.
    - The other checks apply to a 👤 fact, for example the check of a fact that is no longer true.
    - When a command, a tool, or a service gives an error or an output that makes you change what you do, and the output is a non-obvious fact, record the output as a fact, with the command and the error text.
    - Do not record an obvious fact or a well-known fact in `## Facts`.
    - If an obvious fact or a well-known fact is the reason of a decision, write the fact in the "because" part of that decision.
    - If an obvious fact or a well-known fact justifies only a constraint or a non-goal, do not record the fact in `## Facts`. Do not add the fact to `## Constraints` or `## Non-Goals` either, because an edit of those two sections makes the preview stale.
    - Do not record a guess.
    - A sentence that states a choice, for example "the code must resize the images in one batch", is a decision, not a fact.
    - Do not record numbers or statistics that soon go out of date. A number as a reference or an example is OK.

    ## Fact format

    - Write `- F<n>: <fact>`.
    - Start the fact text with one emoji for its source:
      - 👤 the user
      - 📖 documentation
      - 🎫 a ticket
      - 📊 an external report
      - 🌐 online research or a community
      - 🔬 a test run or a probe
      - 🔍 a long analysis of the code
    - Also give the source in words: a command or a test that you ran, the files that you analyzed, a doc URL, a log, or an error text.
    - Do not change an existing fact only to add an emoji.
    - Write a fact so that the fact stays true after the change, for example "Before this change, the thumbnail folder did not exist."

    ## Exit-code rule

    - To know the exit code of a command, run `node openspec/schemas/plan-lite/exit-code.mjs <command> <args...>`.
    - Run the `exit-code.mjs` command alone, not in a chain.
    - Read the last line of the output: `exit: <code>`.
    - If the last line is `exit: not run (...)`, or has no `exit:`, the command did not run. Follow the failure rule.
    - Do not add `echo $?`.

    ## Test rule

    - When you change a behavior, write or update a test that fails if the behavior breaks.
    - If the change replaces an old behavior, the test must also fail on the old behavior.
    - A manual run is not a test. Write the test in a file that the test command of the repo runs.
    - If the repo has no test setup, add the smallest test setup that needs no new dependency, for example `node:test` for JavaScript.

    ## ID rule

    - Give each new item a number higher than each ID of its kind in the file.
    - Do not add an ID to an existing item that has none.
    - Use the plan.md IDs (`C<n>`, `OQ<n>`, `F<n>`, `D<n>`) only in plan.md, in tasks-preview.md, and in a reply to the user.
    - Do not write the plan.md IDs in another file, a code comment, a commit message, a pull request, or a ticket.
    - To refer to a plan.md item in a file other than plan.md and tasks-preview.md, use the item title, or a short form of its text, with the change name.
    - If the ID comment of an older plan.md gives another form of this ID rule, follow this ID rule.
